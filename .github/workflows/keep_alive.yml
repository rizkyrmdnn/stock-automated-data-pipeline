name: Streamlit Keep-Alive Pinger

on:
  schedule:
    # Run every 2 days at 00:00 UTC (07:00 WIB)
    - cron: '0 0 */2 * *'
  
  workflow_dispatch: # Manual trigger

jobs:
  ping-dashboard:
    runs-on: ubuntu-latest
    
    steps:
      - name: Hit Streamlit App
        # Flag -I cuma ngambil header aja (biar ringan), -s buat silent error, -X GET mastiin requestnya GET.
        run: curl -I -s -X GET https://prediktif-sentimen-berita-saham.streamlit.app/ > /dev/null
        
      - name: Success Message
        run: echo "Dashboard berhasil di-ping dan tetap melek!"