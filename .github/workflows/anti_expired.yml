name: Perpanjang Umur Tabel BigQuery

on:
  # Jalan otomatis setiap tanggal 1 jam 00:00 UTC (Sebulan sekali)
  schedule:
    - cron: '0 0 1 * *'
  # Tombol manual buat jalanin paksa (buat testing)
  workflow_dispatch:

jobs:
  refresh-tabel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        # Kita cuma butuh library bigquery buat script ini
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-bigquery

      - name: Setup GCP Credentials
        # Bikin file JSON dari GitHub Secrets persis kayak pipeline harian lo
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT }}' > kunci-gcp.json

      - name: Jalankan Script Perpanjang Umur
        run: |
          python perpanjang_bq.py