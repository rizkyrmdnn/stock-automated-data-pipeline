name: Perpanjang Umur Tabel BigQuery

on:
  # Jalan otomatis setiap tanggal 1 jam 00:00 UTC (Sebulan sekali)
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch: # Tombol manual

jobs:
  refresh-tabel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        
        run: |
          python -m pip install --upgrade pip
          pip install google-cloud-bigquery

      - name: Setup GCP Credentials
        run: |
          echo '${{ secrets.GCP_SERVICE_ACCOUNT }}' > kunci-gcp.json

      - name: Jalankan Script Perpanjang Umur
        run: |
          python perpanjang_bq.py